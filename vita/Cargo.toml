[package]
name = "muse-gadget-vita"
version = "0.3.0"
edition = "2021"

[dependencies]
getrandom = "0.2.17"
libc = "0.2"
muse-link = { path = "../link" }
rustls = { version = "0.23.45", default-features = false }
serde_json = "1"
vitasdk-sys = { version = "0.3.3", features = [
    "SceAudio_stub",
    "SceAudioIn_stub",
    "SceCtrl_stub",
    "SceDisplay_stub",
    "SceLibKernel_stub",
    "SceNet_stub",
    "SceNetCtl_stub",
    "ScePower_stub",
    "SceRtc_stub",
    "SceSysmem_stub",
    "SceSysmodule_stub",
    "SceTouch_stub",
] }

[package.metadata.vita]
title_id = "MUSE00001"
title_name = "Muse"
